<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pelicula.contenido.titulo} + ' - ZuperTV'">Reproductor</title>
    <style>
        body { background-color: #000; color: white; font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        .contenedor-video { max-width: 1000px; margin: 0 auto; }
        video { width: 100%; border-radius: 8px; margin-top: 20px; outline: none; box-shadow: 0 4px 15px rgba(255,255,255,0.1); }
        .info { text-align: left; margin-top: 20px; padding: 20px; background-color: #1a1a1a; border-radius: 8px; }
        .btn-volver { color: #aaa; text-decoration: none; display: flex; align-items: left; margin-bottom: 20px; font-weight: bold; }
        .btn-volver:hover { color: white; }
    </style>
</head>
<body>

    <div class="contenedor-video">
        <a th:href="@{/catalogo}" class="btn-volver">&larr; Volver al catálogo</a>

        <h1 th:text="${pelicula.contenido.titulo}">Título de la Película</h1>
        
        <video controls autoplay>
            <source th:src="${pelicula.urlVideo}" type="video/mp4">
            Tu navegador no soporta la reproducción de video.
        </video>

        <div class="info">
            <p th:text="${pelicula.contenido.descripcion}">Descripción de la película...</p>
            <p style="color: #888;">Duración: <span th:text="${pelicula.duracionMinutos}"></span> minutos</p>
        </div>
    </div>

</body>
</html>
